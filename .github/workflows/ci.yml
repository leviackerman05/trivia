name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: triviahub
          POSTGRES_PASSWORD: triviahub
          POSTGRES_DB: triviahub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triviahub"
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://triviahub:triviahub@localhost:5432/triviahub
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      # Workspace install: root Astro app + @triviahub/server.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck (astro check)
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Apply database migrations
        run: pnpm --filter @triviahub/server db:deploy

      - name: Server tests (integration)
        run: pnpm --filter @triviahub/server test

      - name: Server build (tsc)
        run: pnpm --filter @triviahub/server build

      - name: Build (astro build)
        run: pnpm build

      - name: Smoke test (serves dist/ and verifies key routes)
        run: pnpm smoke
